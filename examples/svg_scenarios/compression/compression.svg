<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Subduction setup: oceanic lithosphere (left) - continental margin ramp - non-cratonic continental lithosphere - craton (right).
     1600 x 400 km, 1 user unit = 1 km, page = model domain (see the 'setup' rectangle for Lx, Lz, dx, dz).
     Oceanic lithosphere (x < 797.5 km): crust 7 km + mantle 53 km (60 km below the surface).
     Continental margin ramp (797.5 < x < 897.5 km, 100 km wide):
       - Moho from 47 to 75 km depth below the page top (crust 7 -> 35 km); the continental crustal layers thin proportionally;
       - base of the lithosphere from 100 to 160 km depth below the page top (60 -> 120 km below the surface).
     Non-cratonic continental lithosphere (897.5 < x < 1199.5 km): sediments 3, decolement 1, upper crust 21, lower crust 10,
       lithospheric mantle 85 km. Craton (x > 1199.5 km): upper 85 + lower 125 km of cratonic lithospheric mantle.
     Weak zone: 10 km wide band dipping 45 degrees under the continent, from the base of the ramp (x = 787.5-797.5 km at the
       surface) down to 110 km below the surface.
     Edges are at x.5 km so they never fall on the grid nodes (1 or 2 km resolution). -->

<!-- Example of the compression regime (subduction setup): the oceanic plate is pushed from the left at 1 cm/yr. -->
<svg
   width="1600mm"
   height="400mm"
   viewBox="0 0 1600 400"
   version="1.1"
   id="svg1"
   sodipodi:docname="compression.svg"
