# tapioca environment with fixed versions (reproducibility and documentation).
# Includes PETSc 3.24.5 (OpenMPI build) to build and run Mandyoc
# in the same environment, without activating another one.
#
# Versions taken on 2026-10-28 (macOS arm64, conda-forge).
#
#   conda env create -f environment.yml
#   conda activate tapioca
#   pip install -e .          # at the root of the tapioca repository
#
# Not installed by conda: the SVG scenarios (tapioca.inputs.svg) are read as SVG 1.1 files saved by
# Inkscape 1.4 (tested with Inkscape 1.4.4); other versions are read with a warning.
name: tapioca
channels:
  - conda-forge
dependencies:
  - python=3.14.10
  - pip=26.2.2

  # tapioca core
  - numpy=2.5.4
  - scipy=1.18.1
  - xarray=2026.9.0
  - matplotlib=3.11.2
  - h5py=3.16.0=mpi_openmpi_*
  - h5netcdf=1.8.1
  - shapely=2.2.0
  - numba=0.68.0
  - dask=2026.8.0
  - svgelements=1.9.6
  - astropy=8.0.2
  - pymp-pypi=0.4.5

  # visualization / notebooks
  - pyvista=0.49.1
  - pythreejs=2.4.2
  - ipyvtklink=0.2.3
  - jupyterlab=4.6.4
  - ipython=9.17.1

  # tests
  - pytest=9.1.1

  # documentation
  - sphinx=9.2.0
  - myst-parser=5.1.0
  - sphinx_rtd_theme=3.1.0
  - linkify-it-py=2.2.0
  - sphinxcontrib-mermaid=2.1.1